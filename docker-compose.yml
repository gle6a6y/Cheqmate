services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cheqmate
      POSTGRES_USER: cheqmate
      POSTGRES_PASSWORD: cheqmate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  cheque-api:
    build:
      context: ./cheque-python-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - cheque-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cheqmate
      SPRING_DATASOURCE_USERNAME: cheqmate
      SPRING_DATASOURCE_PASSWORD: cheqmate

volumes:
  pgdata:
